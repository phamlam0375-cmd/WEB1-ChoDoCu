- name: Cai Node.js
  uses: actions/setup-node@v7
  with:
    node-version: 20
    cache: pnpm
    cache-dependency-path: frontend/pnpm-lock.yaml

- name: Cai pnpm
  uses: pnpm/action-setup@v4
  with:
    version: 10

- name: Cai thu vien
  run: pnpm install --frozen-lockfile

- name: Kiem tra code
  run: pnpm run lint --if-present

- name: Build React
  run: pnpm run build