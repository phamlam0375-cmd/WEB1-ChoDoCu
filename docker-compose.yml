services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --max_allowed_packet=128M
      - --innodb_buffer_pool_size=512M
    environment:
      MYSQL_DATABASE: cho_do_cu
      MYSQL_USER: cho_do_cu
      MYSQL_PASSWORD: cho_do_cu_password
      MYSQL_ROOT_PASSWORD: root_password_change_me
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot_password_change_me"
        ]
      interval: 10s
      timeout: 5s
      retries: 15

  api:
    build: ./backend
    restart: unless-stopped
    # backend/.env không bắt buộc: thiếu file thì dùng giá trị mặc định trong config.
    env_file:
      - path: ./backend/.env
        required: false
    # Trong Docker, API luôn kết nối MySQL qua tên dịch vụ "mysql", cổng 3306.
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    # Tự chạy migration và nạp dữ liệu mẫu (nếu database trống) rồi mới khởi động API.
    command: pnpm run docker:dev
    depends_on:
      mysql:
        condition: service_healthy

  # Nginx phục vụ website React đã build và chuyển /api sang backend.
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  mysql_data: