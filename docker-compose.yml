
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped

    command:
      - --max_allowed_packet=128M
      - --innodb_buffer_pool_size=512M

    environment:
      MYSQL_DATABASE: cho_do_cu
      MYSQL_USER: cho_do_cu
      MYSQL_PASSWORD: cho_do_cu_password
      MYSQL_ROOT_PASSWORD: root_password_change_me

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot_password_change_me"
        ]
      interval: 10s
      timeout: 5s
      retries: 15

  api:
    build: ./backend
    restart: unless-stopped

    env_file:
      - path: ./backend/.env
        required: false
      - path: ./.env
        required: false

    environment:
      NODE_ENV: development
      OTP_DELIVERY_MODE: ${OTP_DELIVERY_MODE:-development-log}
      AUTH_DEV_HEADER: "false"

      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: cho_do_cu
      DB_USER: cho_do_cu
      DB_PASSWORD: cho_do_cu_password

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

      D01_DEMO_MODE: ${D01_DEMO_MODE:-false}
      D01_DEMO_USER_ID: ${D01_DEMO_USER_ID:-}

    ports:
      - "3000:3000"

    volumes:
      - ./backend:/app
      - /app/node_modules

    command: npx pnpm run docker:dev

    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile

      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        VITE_ENABLE_GOOGLE_MOCK: "false"
        VITE_D01_DEMO_MODE: "false"
        VITE_DEV_ACCOUNT_SWITCHER: "false"

    restart: unless-stopped

    ports:
      - "8081:80"

    depends_on:
      - api

volumes:
  mysql_data:
