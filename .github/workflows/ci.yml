name: CI - Cho do cu

on:
  push:
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Kiem tra Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v6

      - name: Cai pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Cai Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Cai thu vien
        run: pnpm install --frozen-lockfile

      - name: Kiem tra frontend
        working-directory: frontend
        run: pnpm lint

      - name: Build React
        working-directory: frontend
        run: pnpm build

  backend:
    name: Kiem tra Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v6

      - name: Cai pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Cai Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Cai thu vien
        run: pnpm install --frozen-lockfile

      - name: Kiem tra Backend
        working-directory: backend
        run: pnpm check

      - name: Build Backend
        run: pnpm run build --if-present

      - name: Chay kiem thu
        run: pnpm test --if-present

  docker:
    name: Kiem tra Docker
    runs-on: ubuntu-latest
    needs: [frontend, backend]

    steps:
      - name: Tai ma nguon
        uses: actions/checkout@v6

      - name: Build Docker
        run: docker compose build