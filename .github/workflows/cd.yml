name: CD - Deploy laptop

on:
  workflow_run:
    workflows: ["CI - Cho do cu"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-laptop
  cancel-in-progress: false

jobs:
  deploy:
    name: Trien khai Docker tren laptop
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    # GitHub Repository Variables, không phải secret/token. Chỉ bật cho test nhóm.
    env:
      D01_DEMO_MODE: ${{ vars.D01_DEMO_MODE || 'false' }}
      D01_DEMO_USER_ID: ${{ vars.D01_DEMO_USER_ID || '' }}

    steps:
      - name: Tai dung commit da qua CI
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || 'master' }}
          clean: true

      - name: Tao file cau hinh backend
        shell: powershell
        env:
          BACKEND_ENV_B64: ${{ secrets.BACKEND_ENV_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BACKEND_ENV_B64)) {
            Copy-Item "backend/.env.example" "backend/.env" -Force
            Write-Host "Dang dung backend/.env.example cho moi truong demo."
          }
          else {
            $bytes = [Convert]::FromBase64String($env:BACKEND_ENV_B64)
            [IO.File]::WriteAllBytes("$PWD/backend/.env", $bytes)
            Write-Host "Da tao backend/.env tu GitHub Secret."
          }

      - name: Kiem tra Docker Desktop
        shell: powershell
        run: |
          docker version
          if ($LASTEXITCODE -ne 0) {
            throw "Docker Desktop chua chay hoac runner khong co quyen dung Docker."
          }
          docker compose version

      - name: Kiem tra cau hinh demo D01
        shell: powershell
        run: |
          if ($env:D01_DEMO_MODE -notin @('true', 'false')) {
            throw "D01_DEMO_MODE phai la true hoac false."
          }
          if ($env:D01_DEMO_MODE -eq 'true' -and $env:D01_DEMO_USER_ID -notmatch '^[1-9][0-9]*$') {
            throw "Bat demo D01 can D01_DEMO_USER_ID hop le (tai khoan ACTIVE, khong ADMIN)."
          }

      - name: Kiem tra Docker Compose
        shell: powershell
        run: docker compose -p cho-do-cu-cd config

      - name: Build va khoi dong he thong
        shell: powershell
        run: docker compose -p cho-do-cu-cd up -d --build --remove-orphans

      - name: Cho API san sang
        shell: powershell
        run: |
          $ready = $false

          for ($i = 1; $i -le 36; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:3000/api/health" -UseBasicParsing -TimeoutSec 5

              if ($response.StatusCode -eq 200) {
                $ready = $true
                Write-Host "API da san sang."
                break
              }
            }
            catch {
              Write-Host "Dang cho API khoi dong: lan $i/36"
            }

            Start-Sleep -Seconds 5
          }

          if (-not $ready) {
            throw "API khong san sang sau 3 phut."
          }

      - name: Chay migration
        shell: powershell
        run: |
          docker compose -p cho-do-cu-cd exec -T api pnpm run db:migrate
          if ($LASTEXITCODE -ne 0) {
            throw "Chay migration that bai."
          }

      - name: Kiem tra Nginx
        shell: powershell
        run: |
          $response = Invoke-WebRequest -Uri "http://localhost:8081" -UseBasicParsing -TimeoutSec 10

          if ($response.StatusCode -ne 200) {
            throw "Nginx cong 8081 khong tra ve HTTP 200."
          }

      - name: Hien thi container
        shell: powershell
        run: docker compose -p cho-do-cu-cd ps

      - name: Hien thi log khi trien khai loi
        if: failure()
        shell: powershell
        run: docker compose -p cho-do-cu-cd logs --no-color --tail=200
