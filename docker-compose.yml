services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --max_allowed_packet=128M
      - --innodb_buffer_pool_size=512M
    environment:
      MYSQL_DATABASE: cho_do_cu
      MYSQL_USER: cho_do_cu
      MYSQL_PASSWORD: cho_do_cu_password
      MYSQL_ROOT_PASSWORD: root_password_change_me
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password_change_me"]
      interval: 10s
      timeout: 5s
      retries: 15

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  mysql_data: