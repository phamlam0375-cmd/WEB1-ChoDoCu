server {
    listen 80;

    server_name _;

    # Ảnh bằng chứng tối đa 5MB (mặc định của Nginx chỉ 1MB).
    client_max_body_size 6m;

    # Tra địa chỉ container API qua DNS nội bộ của Docker mỗi 10 giây, để khi container
    # API được tạo lại (đổi địa chỉ) Nginx không gọi nhầm địa chỉ cũ.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Website React đã build; mọi đường dẫn (/admin, /reports...) trả về index.html.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
