server {
    listen 80;

    server_name _;

    # Không lộ phiên bản Nginx trong header "Server".
    server_tokens off;

    # Ảnh bằng chứng tối đa 5MB (mặc định của Nginx chỉ 1MB).
    client_max_body_size 6m;

    # Tra địa chỉ container API qua DNS nội bộ của Docker mỗi 10 giây, để khi container
    # API được tạo lại (đổi địa chỉ) Nginx không gọi nhầm địa chỉ cũ.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Website React đã build; mọi đường dẫn (/admin, /reports...) trả về index.html.
    # Header bảo mật cho trang web (các đường dẫn /api/ đã có helmet ở backend).
    # Cho phép Google đăng nhập, ảnh Unsplash, ô bản đồ và tra địa chỉ OpenStreetMap.
    # style-src-attr 'unsafe-inline' chỉ dành cho thuộc tính style="" (React, Leaflet).
    location / {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'sha256-AVTm08UMHPqpttgoudpSsvenKKfidtwuSnUVJLIuqcA=' https://accounts.google.com/gsi/style; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://images.unsplash.com https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://accounts.google.com/gsi/ https://nominatim.openstreetmap.org; frame-src https://accounts.google.com/gsi/; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
