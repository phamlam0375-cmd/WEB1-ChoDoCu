# Chi dung local: ghep sau docker-compose.yml va docker-compose.local-db.yml.
# Khong chay prepare-db, migration hoac seeder khi bat debug.
services:
  api:
    environment:
      NODE_ENV: development
      PORT: "3000"
    ports: !override
      - "127.0.0.1:3001:3000"
      - "127.0.0.1:9229:9229"
    command: >-
      sh -c "CI=true pnpm install --frozen-lockfile &&
      exec pnpm exec nodemon --legacy-watch --polling-interval 500
      --signal SIGTERM --inspect=0.0.0.0:9229 src/server.js"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 120s
